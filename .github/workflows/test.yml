name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: addon-dnd-engine
      - uses: actions/checkout@v7
        with:
          repository: pjunak/ttrpg-codex
          path: ttrpg-codex
      - uses: actions/setup-go@v7
        with:
          go-version-file: addon-dnd-engine/go.mod
          cache-dependency-path: addon-dnd-engine/go.sum
      - run: go test ./...
        working-directory: addon-dnd-engine
      - run: go vet ./...
        working-directory: addon-dnd-engine
      - run: go test -race ./internal/rules ./internal/provider ./internal/engine
        working-directory: addon-dnd-engine
      - name: Build release package
        run: go run ./cmd/build-package
        working-directory: addon-dnd-engine
      - name: Inspect release package with the host
        run: go run ./cmd/codex-addon-inspect ../addon-dnd-engine/dist/dnd-engine-3.0.0.zip
        working-directory: ttrpg-codex
