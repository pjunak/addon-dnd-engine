name: Test

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.tools.sum
      - run: go mod download -modfile=go.tools.mod
      - run: go run ./tools/check.go workflows
      - run: go run ./tools/check.go vuln
      - run: go run ./tools/check.go fast
      - run: go run ./tools/check.go test
      - name: Build release package
        run: go run ./cmd/build-package
      - name: Verify the build left tracked source unchanged
        run: |
          git diff --exit-code
          test -z "$(git ls-files -- worker)"
      - name: Locate built package
        id: package
        run: |
          archive="$(jq -er '"dist/\(.id)-\(.version).zip"' addon.json)"
          test -f "$archive"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
      - name: Inspect release package with the host inspector
        run: go tool -modfile=go.tools.mod codex-addon-inspect "${{ steps.package.outputs.archive }}"
      - uses: actions/upload-artifact@v7
        with:
          name: reviewed-package
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish tested commit
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: pjunak/ttrpg-codex/.github/actions/publish-addon@b9eed4ef7664c561ee7e78117a1982f5577e92a4
