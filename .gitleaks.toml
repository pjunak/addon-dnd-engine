[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Git history: the retired testdata/v1-parity.json recorded source-file SHA-256 hashes, not credentials"
condition = "AND"
paths = ['''(^|[/\\])testdata[/\\]v1-parity\.json$''']
regexTarget = "match"
regexes = ['''^api\.js":"[a-f0-9]{64}"$''']
