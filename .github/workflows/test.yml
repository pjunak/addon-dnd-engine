name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          path: addon-dnd-engine
      - uses: actions/checkout@v7
        with:
          repository: pjunak/ttrpg-codex
          path: ttrpg-codex
      - uses: actions/setup-go@v7
        with:
          go-version-file: addon-dnd-engine/go.mod
          cache-dependency-path: |
            addon-dnd-engine/go.sum
            ttrpg-codex/go.sum
      - run: go test ./...
        working-directory: addon-dnd-engine
      - run: go vet ./...
        working-directory: addon-dnd-engine
      - run: go test -race ./internal/rules ./internal/provider ./internal/engine
        working-directory: addon-dnd-engine
      - name: Build release package
        run: go run ./cmd/build-package
        working-directory: addon-dnd-engine
      - name: Locate built package
        id: package
        shell: bash
        run: |
          archive="$(jq -er '"dist/\(.id)-\(.version).zip"' addon.json)"
          test -f "$archive"
          printf 'archive=%s/%s\n' "$PWD" "$archive" >> "$GITHUB_OUTPUT"
        working-directory: addon-dnd-engine
      - name: Inspect release package with the host
        env:
          ADDON_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: go run ./cmd/codex-addon-inspect "$ADDON_ARCHIVE"
        working-directory: ttrpg-codex

      - uses: actions/upload-artifact@v7
        with:
          name: reviewed-package
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 14
