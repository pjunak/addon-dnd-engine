name: Quality maintenance

on:
  # Weekly re-check for new advisories; pushes are checked by the Test workflow.
  schedule:
    - cron: "47 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  workflows:
    name: Workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.tools.sum
      - run: go mod download -modfile=go.tools.mod
      - run: go run ./tools/check.go workflows

  vulnerabilities:
    name: Reachable Go vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.tools.sum
      - run: go mod download -modfile=go.tools.mod
      - run: go run ./tools/check.go vuln
